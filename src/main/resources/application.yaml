server:
  port: 8084

spring:
  application:
    name: recipemate

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true


spoonacular:
  api:
    key: ${SPOONACULAR_API_KEY}
    base-url: https://api.spoonacular.com


security:
  jwt:
    secret: ${JWT_SECRET}


cloudinary:
  cloud-name: pgdfdj6j
  api-key: ${api_key}
  api-secret: ${api_secret}


groq:
  api:
    key: ${groq_api_key}
    base-url: https://api.groq.com/openai/v1/chat/completions
    model: openai/gpt-oss-20b


